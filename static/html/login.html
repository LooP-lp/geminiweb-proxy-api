<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - Gemini API</title>
<link rel="stylesheet" href="/static/css/login.css">
</head>
<body>
<div class="login-card">
<div class="logo">&#129302;</div>
<h1>Gemini API</h1>
<p class="subtitle">请登录或注册以访问后台管理</p>

<div class="tabs">
<div class="tab active" onclick="switchTab('login')">登 录</div>
<div class="tab" onclick="switchTab('register')">注 册</div>
</div>

<div id="error" class="error"></div>
<div id="success" class="success"></div>

<div id="panel-login" class="form-panel active">
<form id="loginForm">
<div class="form-group">
<label>用户名</label>
<input type="text" name="username" id="loginUsername" placeholder="请输入用户名" required autofocus>
</div>
<div class="form-group">
<label>密码</label>
<input type="password" name="password" id="loginPassword" placeholder="请输入密码" required>
</div>
<button type="submit" class="btn" id="loginBtn">登 录</button>
</form>
</div>

<div id="panel-register" class="form-panel">
<form id="registerForm">
<div class="form-group">
<label>用户名</label>
<input type="text" name="username" id="regUsername" placeholder="请输入用户名" required>
</div>
<div class="form-group">
<label>邮箱</label>
<input type="email" name="email" id="regEmail" placeholder="请输入邮箱" required>
</div>
<div class="form-group">
<label>密码</label>
<input type="password" name="password" id="regPassword" placeholder="请输入密码（至少6位）" required minlength="6">
</div>
<div class="form-group">
<label>验证码</label>
<div class="code-row">
<input type="text" name="code" id="regCode" placeholder="6位验证码" required maxlength="6">
<button type="button" class="btn-secondary" id="sendCodeBtn" onclick="sendVerifyCode()">发送验证码</button>
</div>
</div>
<button type="submit" class="btn" id="registerBtn">注 册</button>
</form>
</div>

<div class="ip-info">
<img src="https://ping0.cc/img1" alt="IP Info" loading="lazy" onerror="this.parentElement.style.display='none'">
</div>
</div>

<script src="/static/js/login.js"></script>
</body>
</html>
